<title>筋トレ管理</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--sub:#6b6b6b;--line:#e4e4e4;--soft:#f3f3f3;--red:#d7141a;--red-weak:#fdeced;--red-ink:#b80f14;--hero:#111;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#161616;--ink:#f3f3f3;--sub:#9b9b9b;--line:#2b2b2b;--soft:#222;--red:#ff3b40;--red-weak:#3a1315;--red-ink:#ff6b6f;--hero:#1b1b1b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.has-timer{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:3px solid var(--ink)}
.brand{font-weight:900;letter-spacing:.1em;font-size:18px;display:flex;align-items:center;gap:8px}
.mark{width:13px;height:18px;background:var(--red);display:inline-block;transform:skewX(-14deg)}
.badge{font-size:12px;letter-spacing:0;font-weight:800;color:var(--red);border:1.5px solid var(--red);padding:1px 7px;border-radius:999px}
main{padding:16px;max-width:640px;margin:0 auto}
h2{font-size:12px;letter-spacing:.1em;color:var(--sub);margin:22px 0 8px;font-weight:800;text-transform:uppercase}
h3{margin:4px 0 14px;font-size:19px}
.muted{color:var(--sub);font-size:13px}
.red{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.p0{padding:0;overflow:hidden}
.btn{appearance:none;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:800;font-size:16px;border-radius:12px;padding:10px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line);border-width:1.5px}
.btn.danger{color:var(--red)}
.btn.block{width:100%;display:flex}
.btn.big{min-height:64px;font-size:19px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-width:1.5px;border-radius:10px}
.btn+.btn.block,.btn.block+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.pill.red{background:var(--red-weak);color:var(--red-ink)}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:20px 0}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{background:none;border:0;color:var(--sub);font-size:11px;font-weight:800;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--red)}
/* hero */
.hero{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:18px;margin-bottom:12px}
.hero-l{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.hero-m{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.letter{font-size:64px;line-height:1;font-weight:900;color:var(--red);font-style:italic}
.hero-m b{font-size:20px}
.hero-m small{color:var(--sub)}
.hero .seg2{margin-bottom:12px}
.hero .seg2 button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.hero .seg2 button.on small{color:#ff8a8d}
.rir{font-size:14px;font-weight:700;border-left:4px solid var(--red);padding:2px 0 2px 10px;margin:0 0 14px;color:var(--ink)}
.seg2,.seg3{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg2 button,.seg3 button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:800;font-size:15px;color:var(--sub);min-height:44px}
.seg2 button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg2 small{font-size:10px;color:var(--red);display:block;line-height:1}
.plan-row{display:grid;grid-template-columns:1fr 70px 14px;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15px}
.plan-row:last-child{border-bottom:0}
.plan-row b{font-variant-numeric:tabular-nums;text-align:right}
.plan-row small{color:var(--sub)}
.k{font-style:normal;font-size:12px;text-align:center}
.k.up{color:var(--red)}.k.down{color:var(--sub)}.k.hold{color:var(--red)}
/* session */
.sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sess-title{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px}
.sess-title .letter{font-size:32px}
.date-in{width:auto;padding:4px 8px;font-size:16px;border-radius:8px;min-height:36px}
.sess-sub{font-size:14px;color:var(--sub);font-weight:700}
.progress{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--red);transition:width .3s}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;scroll-margin-top:70px;overflow:hidden}
.ex.cur{border:2px solid var(--ink)}
.ex.done:not(.cur){opacity:.6}
.ex-head{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px}
.ex-no{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.ex.cur .ex-no{background:var(--red);color:#fff}
.ex-name{flex:1;font-weight:800;font-size:16px;line-height:1.3}
.ex-name em{font-style:normal;font-size:10px;background:var(--soft);color:var(--sub);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.ex-target{font-weight:600;font-size:12px;color:var(--sub)}
.st{font-size:13px;font-weight:800;color:var(--sub);white-space:nowrap}
.st.ok{color:var(--ink)}.st.pain{color:var(--red)}
.ex-mini{padding:0 14px 12px 54px;font-size:13px;color:var(--sub);margin-top:-6px}
.ex-body{padding:0 14px 14px}
.ex-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ib{background:var(--soft);border-radius:10px;padding:8px 10px}
.ib-l{font-size:11px;font-weight:800;color:var(--sub)}
.ib-v{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.35}
.ib.sg{background:var(--red-weak)}
.ib.sg .ib-v{color:var(--red-ink)}
.sg-msg{font-size:13px;margin-bottom:8px;color:var(--sub)}
.sg-msg.up{color:var(--red-ink);font-weight:700}
.sg-msg.hold,.sg-msg.down{color:var(--ink);font-weight:700}
.ex-memo{font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap}
.sets-h{display:grid;grid-template-columns:16px 1.15fr 1fr 52px;gap:5px;font-size:11px;font-weight:800;color:var(--sub);text-align:center;margin:4px 0}
.set{display:grid;grid-template-columns:16px 1.15fr 1fr 52px;gap:5px;align-items:center;margin-bottom:6px}
.set-no{font-weight:900;color:var(--sub);text-align:center}
.set.now .set-no{color:var(--red)}
.stp{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;height:52px;background:var(--bg)}
.set.now .stp{border-color:var(--ink)}
.stp button{width:32px;flex:none;border:0;background:var(--soft);font-size:22px;font-weight:700}
.stp button:active{background:var(--line)}
.stp input{border:0;border-radius:0;padding:0;text-align:center;font-size:18px;letter-spacing:-.02em;font-weight:800;min-width:0;flex:1;font-variant-numeric:tabular-nums;background:transparent}
.stp.wide{height:50px}
.stp.wide button{width:60px;font-size:16px}
.chk{height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);display:grid;place-items:center}
.chk svg{width:26px;height:26px;stroke:var(--ink);stroke-width:3;fill:none;opacity:.25}
.set.is-done .chk{background:var(--red);border-color:var(--red)}
.set.is-done .chk svg{stroke:#fff;opacity:1}
.set.is-done .stp{background:var(--soft);border-color:transparent}
.set.is-done .stp button{visibility:hidden}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.row-btns .btn{flex:1;white-space:nowrap}
.btn.swap{border-color:var(--red);color:var(--red-ink)}
.sh{display:flex;align-items:center;gap:10px}
.sh-l{font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.seg3{flex:1}
.seg3 button{font-size:14px;min-height:42px}
.seg3 button.on{background:var(--ink);color:var(--bg)}
.seg3 button.odd.on{background:#e8a200;color:#111}
.seg3 button.pain.on{background:var(--red);color:#fff}
.next-btn{margin-top:12px}
.five{display:flex;gap:6px}
.five button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:900;font-size:18px}
.five button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.five-l{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;min-height:38px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;padding:8px 0}
.check input{width:22px;height:22px;accent-color:var(--red)}
.finish{margin-top:18px}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgba(0,0,0,.05);padding:8px 12px;overflow:hidden}
.t-fill{position:absolute;left:0;top:0;height:4px;background:var(--red);width:0}
.t-row{display:flex;gap:6px;align-items:center;max-width:640px;margin:0 auto}
.t-main{flex:1.4;font-size:14px;height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800}
.t-main b{font-size:24px;font-variant-numeric:tabular-nums}
.timer.run .t-main{border-color:var(--red);color:var(--red)}
.timer.ring .t-main{background:var(--red);border-color:var(--red);color:#fff;animation:pulse .5s 6 alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.t-pre{display:flex;gap:4px}
.t-pre button,.t-add{height:52px;min-width:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:14px;padding:0 6px}
.t-pre button.on{border-color:var(--red);color:var(--red)}
/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats3>div{background:var(--soft);border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--sub)}
.stats3 b{display:block;font-size:22px;color:var(--ink)}
/* menu editor */
.mrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.off{opacity:.45}
.mrow-main{flex:1;padding:12px 14px;min-width:0}
.mrow-main b{display:block;font-size:15px}
.mrow-main small{color:var(--sub);font-size:12px}
.mrow-btns{display:flex}
.mrow-btns button{width:44px;height:56px;border:0;background:none;font-size:18px;color:var(--sub)}
/* meals */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav button{width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:22px}
.datenav button:disabled{opacity:.3}
.target{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target div{font-size:13px;color:var(--sub)}
.target b{font-size:24px;color:var(--ink);margin-right:2px}
.target small{display:block;font-weight:800}
.checks{display:grid;gap:8px}
.ck{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:800;min-height:60px}
.ck .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.ck.on{border-color:var(--red)}
.ck.on .box{background:var(--red);border-color:var(--red)}
.ck .box svg{width:20px;height:20px;stroke:#fff;stroke-width:3.5;fill:none}
.bar{position:relative;height:12px;background:var(--soft);border-radius:9px;margin:12px 0 6px;overflow:visible}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .3s}
.bar-min{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.advice{font-weight:700;border-left:5px solid var(--ink)}
.advice.warn,.advice.up{border-left-color:var(--red)}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--sub)}
.week7 .d{background:var(--soft);border-radius:10px;padding:6px 0}
.week7 .d b{display:block;font-size:16px;color:var(--ink)}
.week7 .d.full b{color:var(--red)}
/* body */
.wk-list div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.wk-list div:last-child{border-bottom:0}
.wk-list b{font-variant-numeric:tabular-nums}
.btable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.btable th{font-size:11px;color:var(--sub);text-align:right;padding:6px 4px;font-weight:800}
.btable td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
.btable th:first-child,.btable td:first-child{text-align:left}
.btable button{border:0;background:none;color:var(--sub);font-size:16px;padding:0 4px}
/* review */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tl{fill:var(--sub);font-size:10px}
.chart .tv{fill:var(--ink);font-size:11px;font-weight:800}
.chart .ln{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linejoin:round}
.chart .ln.ink{stroke:var(--ink)}
.chart .dot{fill:var(--red)}
.chart .dot.ink{fill:var(--ink)}
.chart .bar-r{fill:var(--ink)}
.chart .bar-r.last{fill:var(--red)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-nav button{width:40px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px}
.cal-h,.cal-r{display:grid;grid-template-columns:repeat(7,1fr) 40px;gap:4px;margin-bottom:4px}
.cal-h span{font-size:11px;font-weight:800;color:var(--sub);text-align:center}
.cal-h span.rec{color:var(--red)}
.cd{aspect-ratio:1;border-radius:9px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.1}
.cd.rec{background:var(--red-weak)}
.cd.out{opacity:.3}
.cd.today{outline:2px solid var(--ink)}
.cd.has{background:var(--bg);box-shadow:inset 0 0 0 2px var(--red);font-weight:800}
.cd.has b{color:var(--red);font-size:11px}
.cnt{display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--sub)}
.cnt.good{color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hist{border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist-h{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;border:0;background:none;text-align:left}
.hist-h .letter{font-size:26px}
.hist-h div{flex:1}
.hist-h small{display:block;color:var(--sub);font-size:12px}
.hist-b{padding:0 14px 12px;font-size:14px}
.hist-b div{padding:3px 0}
textarea.summary{font-size:13px;height:260px;font-family:ui-monospace,Menlo,monospace}

:root{--bg:#fff;--card:#fff;--ink:#0b0d12;--sub:#7a8292;--line:#e6e9ef;--soft:#f4f6f9;
  --blue:#1f5eff;--blue2:#4fc3ff;--blue-weak:#edf3ff;--red:#1f5eff;--red-ink:#1f5eff;--red-weak:#edf3ff;
  --grad:linear-gradient(120deg,#1f5eff 0%,#3a8dff 55%,#62d2ff 100%);
  --glow:0 6px 22px rgba(31,94,255,.28);
  --num:"Barlow C","Barlow Condensed","Arial Narrow",sans-serif;--en:"Mont","Montserrat","Helvetica Neue",sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
:root[data-theme="dark"]{--bg:#07080b;--card:#0f1116;--ink:#f2f4f8;--sub:#8b93a3;--line:#22262f;--soft:#161920;--blue-weak:#0f1a33;--red-weak:#0f1a33}
body{font-family:var(--jp);font-weight:500;letter-spacing:.02em;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 100% 0%,rgba(79,195,255,.10),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(31,94,255,.06),transparent 60%)}
/* header */
.top{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-bottom:12px}
:root[data-theme="dark"] .top{background:rgba(7,8,11,.8)}
.brand{font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.42em;gap:10px}
.brand::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;
  background:radial-gradient(circle,#fff 0 22%,transparent 23%),var(--grad);box-shadow:0 0 0 3px var(--blue-weak),var(--glow)}
.brand-t,.brand-t>span{background:none;color:var(--ink);padding:0;transform:none;box-shadow:none;display:inline}
.badge{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--blue);background:var(--blue-weak);border:0;border-radius:999px;padding:6px 12px 6px 14px;transform:none;box-shadow:none}
main{padding:18px 18px 16px}
/* headings */
h2{display:flex;align-items:center;gap:10px;font-family:var(--jp);font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--sub);
  background:none;padding:0;margin:30px 0 12px;transform:none;box-shadow:none}
h2::before{content:"";width:18px;height:2px;background:var(--grad);border-radius:2px}
h3{font-weight:700;font-size:20px;letter-spacing:.06em;font-style:normal}
.muted{color:var(--sub)}
.red{color:var(--blue)}
/* cards */
.card{border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(11,13,18,.04),0 10px 30px rgba(11,13,18,.05);padding:18px;clip-path:none}
.card.p0{clip-path:none}
/* buttons */
.btn{border-radius:16px;border:1px solid var(--ink);font-weight:700;letter-spacing:.08em;transform:none;box-shadow:none;transition:transform .12s,box-shadow .2s}
.btn>*{transform:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 10px 26px rgba(11,13,18,.22)}
:root[data-theme="dark"] .btn.primary{background:var(--grad);border:0}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn.sm{border-radius:12px;border-width:1px;font-weight:700;font-size:13px;letter-spacing:.06em}
.btn.swap{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;color:var(--blue)}
.btn.danger{color:#d23b4b}
.btn.big{min-height:66px;border-radius:999px;font-family:var(--en);font-weight:700;font-size:17px;letter-spacing:.5em;padding-left:calc(16px + .5em)}
.btn.big::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue2);box-shadow:0 0 12px var(--blue2);margin-left:6px}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:28px;padding:0 20px 22px;
  box-shadow:0 20px 50px rgba(31,94,255,.10),0 2px 6px rgba(11,13,18,.04);clip-path:none}
.hero::before{content:"";position:absolute;right:-120px;top:-60px;width:360px;height:360px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 17px,rgba(31,94,255,.16) 17px 18px);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.hero::after{content:"";position:absolute;right:46px;top:96px;width:16px;height:16px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 6px rgba(79,195,255,.18),0 0 26px 6px rgba(79,195,255,.55)}
.hero>*{position:relative;z-index:1}
.band{margin:0 -20px 4px;height:42px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:.36em}
.band b{font-family:var(--jp);font-weight:600;font-size:12px;letter-spacing:.1em;color:#9fd8ff}
.hero-m{margin:6px 0 14px;align-items:flex-end;gap:12px}
.letter{font-family:var(--num);font-weight:600;font-style:normal;letter-spacing:-.02em;transform:none;text-shadow:none;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(31,94,255,.35))}
.hero .letter{font-size:132px;line-height:.86}
.hero-m b{display:block;background:none;color:var(--ink);padding:0;transform:none;margin:0 0 6px;font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.46em}
.hero-m small{display:block;margin-top:4px;color:var(--sub);font-weight:600;letter-spacing:.18em;font-size:12px}
/* segmented */
.seg2,.seg3{background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg2 button,.seg3 button{border:0;border-radius:12px;background:transparent;color:var(--sub);font-weight:700;transform:none;box-shadow:none;letter-spacing:.06em}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(11,13,18,.10)}
.hero .seg2{margin-bottom:16px}
.hero .seg2 button{font-family:var(--num);font-weight:600;font-size:24px;min-height:50px;line-height:1;letter-spacing:.04em}
.seg2 small{font-family:var(--en);font-size:8px;letter-spacing:.3em;color:var(--blue);margin-top:2px}
.hero .seg2 button.on small{color:var(--blue)}
.seg2 small{font-size:0}
.seg2 small::after{content:"NEXT";font-size:8px}
.seg3 button.on{background:var(--ink);color:var(--bg)}
.seg3 button.odd.on{background:#f5b301;color:#111}
.seg3 button.pain.on{background:#d23b4b;color:#fff}
.rir{display:none}
/* plan list */
.plan-row{grid-template-columns:22px 1fr 72px 14px;border-bottom:1px solid var(--line);padding:13px 18px;font-weight:600;letter-spacing:.04em}
.plan-row:nth-child(odd){background:transparent}
.plan-row::before{content:counter(pr,decimal-leading-zero);counter-increment:pr;font-family:var(--num);font-weight:300;color:var(--sub);font-size:15px}
.card.p0{counter-reset:pr}
.plan-row b{font-family:var(--num);font-weight:600;font-size:22px;letter-spacing:.02em}
.k{font-size:11px}
.k.up{color:var(--blue)}.k.hold{color:#d23b4b}
/* session header */
.sess-head{margin:4px 0 12px}
.sess-title{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.42em;align-items:flex-end;gap:10px;color:var(--ink)}
.sess-title .letter{font-size:64px;line-height:.85;margin:0}
.sess-sub{font-family:var(--jp);font-size:12px;letter-spacing:.06em}
.sess-sub b{font-style:normal;color:var(--blue)}
.progress{height:4px;border:0;border-radius:4px;background:var(--line);transform:none;margin-bottom:18px}
.progress i{background:var(--grad);box-shadow:0 0 10px rgba(79,195,255,.7);border-radius:4px}
/* exercise cards */
.ex{border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(11,13,18,.04);clip-path:none;margin-bottom:12px}
.ex.cur{border:1.5px solid var(--ink);box-shadow:0 18px 40px rgba(31,94,255,.14),0 0 0 4px rgba(31,94,255,.06)}
.ex.done:not(.cur){opacity:.5;box-shadow:none}
.ex-head{padding:14px 16px}
.ex-no{width:auto;height:auto;background:none!important;color:var(--sub);font-family:var(--num);font-weight:300;font-size:22px;transform:none;border-radius:0;min-width:26px}
.ex.cur .ex-no{color:var(--blue)}
.ex-name{font-weight:700;font-size:17px;letter-spacing:.05em}
.ex-target{font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.08em;color:var(--sub)}
.st{font-family:var(--num);font-weight:600;font-size:17px;letter-spacing:.06em;color:var(--sub)}
.st.ok{color:var(--blue)}
.st.pain{color:#d23b4b}
.ex-body{padding:0 16px 16px}
.ib{border:0;border-radius:16px;background:var(--soft);transform:none;padding:10px 12px}
.ib>*{transform:none}
.ib.sg{background:var(--ink);position:relative;overflow:hidden}
.ib.sg::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 7px,rgba(79,195,255,.25) 7px 8px)}
.ib.sg .ib-l{color:#9fd8ff}
.ib.sg .ib-v{color:#fff}
.ib-l{font-family:var(--en);font-weight:700;font-size:9px;letter-spacing:.32em;color:var(--sub)}
.ib-v{font-family:var(--num);font-weight:600;font-size:20px;letter-spacing:.03em}
.sg-msg{font-style:normal;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--sub)}
.sg-msg.up{color:var(--blue)}
.sg-msg.hold,.sg-msg.down{color:#d23b4b}
.ex-memo{border-radius:14px;border-left:0;background:var(--blue-weak);color:var(--ink);font-size:13px}
.sets-h{font-family:var(--en);font-weight:700;font-size:9px;letter-spacing:.32em;color:var(--sub);margin:8px 0 6px}
.set{grid-template-columns:18px 1.15fr 1fr 54px;gap:6px;margin-bottom:8px}
.set-no{font-family:var(--num);font-weight:300;font-size:20px;color:var(--sub)}
.set.now .set-no{color:var(--blue);font-weight:600}
.stp{border:1px solid var(--line);border-radius:16px;background:var(--card);transform:none!important;height:54px}
.set.now .stp{border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,94,255,.10)}
.stp button{background:transparent!important;color:var(--ink)!important;font-weight:300;font-size:24px;width:34px}
.stp button:active{color:var(--blue)!important}
.stp input{font-family:var(--num);font-weight:600;font-size:26px;letter-spacing:.02em;transform:none!important}
.set:not(.now):not(.is-done) .stp button{color:var(--sub)!important}
.set.is-done .stp{background:var(--soft);border-color:transparent;box-shadow:none}
.set.is-done .stp input{color:var(--sub)}
.chk{border:1.5px solid var(--ink);border-radius:16px;transform:none;height:54px;background:var(--card)}
.chk svg{transform:none;stroke:var(--ink);opacity:.18;stroke-width:2.6}
.set.now .chk{box-shadow:none;border-color:var(--ink)}
.set.is-done .chk{background:var(--grad);border:0;box-shadow:0 8px 20px rgba(31,94,255,.35)}
.set.is-done .chk svg{stroke:#fff;opacity:1}
.row-btns{gap:6px}
.sh-l{font-family:var(--en);font-weight:700;font-size:9px;letter-spacing:.3em;color:var(--sub)}
.sh-l{font-size:0}
.sh-l::after{content:"肩";font-family:var(--jp);font-size:12px;letter-spacing:.1em}
.next-btn{border-radius:999px;letter-spacing:.14em}
/* timer */
.timer{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:none;padding:10px 14px}
:root[data-theme="dark"] .timer{background:rgba(7,8,11,.85)}
.t-fill{height:2px;background:var(--grad);box-shadow:0 0 10px rgba(79,195,255,.9)}
.t-main{border:1px solid var(--line);border-radius:999px;transform:none;box-shadow:none;background:var(--card);gap:12px}
.t-main>*{transform:none}
.t-main span{font-size:10px;color:var(--sub)}
.t-main b{font-family:var(--num);font-weight:600;font-size:32px;letter-spacing:.04em}
.timer.run .t-main{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 10px 24px rgba(11,13,18,.25)}
.timer.run .t-main b{background:linear-gradient(120deg,#8fd6ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.timer.run .t-main span{color:#9fd8ff}
.timer.ring .t-main{background:var(--grad);border:0;color:#fff}
.timer.ring .t-main b{color:#fff;background:none;-webkit-background-clip:initial}
.t-pre button,.t-add{border:1px solid var(--line);border-radius:14px;transform:none;font-family:var(--num);font-weight:600;font-size:17px;letter-spacing:.04em;background:var(--card)}
.t-pre button.on{background:var(--blue-weak);color:var(--blue);border-color:var(--blue)}
/* tabs */
.tabs{border-top:1px solid var(--line);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
:root[data-theme="dark"] .tabs{background:rgba(7,8,11,.88)}
.tab{position:relative;color:var(--sub);font-weight:600;font-size:10px;letter-spacing:.14em}
.tab svg{stroke-width:1.7}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;inset:auto;top:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--blue2);transform:none;z-index:1}
.tab.on span{color:var(--ink)}
.tab.on svg{stroke:var(--blue)}
/* others */
.five button{border:1px solid var(--line);border-radius:14px;font-family:var(--num);font-weight:600;font-size:22px;transform:none}
.five button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{border:1px solid var(--line);border-radius:999px;font-weight:600;transform:none;letter-spacing:.04em}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck{border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 14px rgba(11,13,18,.04);font-weight:600;transform:none;letter-spacing:.04em}
.ck.on{border-color:var(--blue);box-shadow:0 8px 22px rgba(31,94,255,.14)}
.ck .box{border-radius:50%;transform:none;border:1.5px solid var(--ink)}
.ck.on .box{background:var(--grad);border:0;box-shadow:0 0 12px rgba(79,195,255,.6)}
.target b{font-family:var(--num);font-weight:600;font-size:34px;letter-spacing:.02em}
.target div{color:var(--sub)}
.bar{border:0;border-radius:6px;height:6px;background:var(--line);transform:none}
.bar i{border-radius:6px;background:var(--grad);box-shadow:0 0 10px rgba(79,195,255,.7)}
.bar-min{background:var(--ink);width:2px}
.advice{border-left:0;font-style:normal;font-weight:600;position:relative;padding-left:22px}
.advice::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;margin-left:8px;border-radius:3px;background:var(--grad)}
.week7 .d{border:1px solid var(--line);border-radius:14px;background:var(--card);transform:none}
.week7 .d b{font-family:var(--num);font-weight:600;font-size:20px}
.week7 .d.full b{color:var(--blue)}
input,select,textarea{border:1px solid var(--line);border-radius:14px;font-weight:600;background:var(--card)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,94,255,.12)}
.field>label,.flabel{color:var(--sub);font-weight:700;letter-spacing:.14em;font-size:11px}
.mrow{border-bottom:1px solid var(--line)}
.mrow-main b{font-weight:700;letter-spacing:.04em}
.btable th{color:var(--sub);font-family:var(--en);font-weight:700;letter-spacing:.2em;font-size:9px}
.btable td{border-top:1px solid var(--line);font-family:var(--num);font-weight:600;font-size:16px}
.datenav b{font-style:normal;font-weight:700;letter-spacing:.08em}
.datenav button,.cal-nav button{border:1px solid var(--line);border-radius:14px;transform:none;font-weight:300;background:var(--card)}
.cd{border-radius:12px;border:0;background:var(--soft);font-family:var(--num);font-weight:600;font-size:14px}
.cd.rec{background:var(--blue-weak);color:var(--blue)}
.cd.has{background:var(--ink);color:#fff;transform:none;box-shadow:0 6px 14px rgba(31,94,255,.25)}
.cd.has b{color:#7fd0ff;font-family:var(--num)}
.cal-h span{font-weight:700;color:var(--sub)}
.cal-h span.rec{color:var(--blue)}
.cnt{font-family:var(--num);font-weight:600;font-size:17px;color:var(--sub)}
.cnt.good{color:var(--blue)}
.stats3>div{border:0;border-radius:18px;background:var(--soft);transform:none}
.stats3 b{font-family:var(--num);font-weight:600;font-size:32px}
.hist-h .letter{font-size:34px;text-shadow:none}
.chart .gl{stroke:var(--line)}
.chart .tl{font-family:var(--num);font-size:11px}
.chart .tv{font-family:var(--num);font-weight:600;font-size:15px}
.chart .ln{stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 4px 6px rgba(31,94,255,.3))}
.chart .ln.ink{stroke:var(--ink);filter:none}
.chart .dot{fill:#fff;stroke:var(--blue);stroke-width:2}
.chart .dot.ink{fill:#fff;stroke:var(--ink)}
.chart .bar-r{fill:var(--ink);transform:none}
.chart .bar-r.last{fill:var(--blue)}
.sheet-bg{background:rgba(11,13,18,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-panel{border-radius:28px 28px 0 0;border-top:0;box-shadow:0 -20px 50px rgba(11,13,18,.15)}
.grab{border-radius:9px;background:var(--line);transform:none}
.toast{border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-style:normal;letter-spacing:.06em;transform:translate(-50%,-20px);box-shadow:0 10px 30px rgba(31,94,255,.3)}
.toast.show{transform:translate(-50%,0)}
.pill{border-radius:999px}
.hist .red,.btable .red{color:#d23b4b}
.brand{font-family:var(--jp);font-weight:700;letter-spacing:.32em;font-size:15px}
.brand::before{background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAE5UlEQVR42u2Zz2scZRjHP8/7zu4mTdI0tpWAv2pRsVoRTEUQRJFSlApFixdRRPDmSZAeFPTk2UP/g4oF0Yp4URAPisVKi9KKihWqtbRWW9NsGrPZzMzzeJiZ3Zl0kybb2UNlhmGYHTZvns/7/Po+s2JmXM+H4zo/KoAKoAKoACqACqACqAAqgArgegEwQ40BTRAGaqx1bVn9QGOGSI/7cqzvd3FZ00TWbHHhMuPDbB4r3wOX2sy22TDEeH0NfxWs5ktqOOHob7x6kIUIg9efYu8UqrhrTqJk8S/P8M53iCPw7NvBgzemz681B2IlVqIY4JPvOTNNzTO3wKFjAFJeCfj0FM0FAuGfFp+fBoiN2FC7Ng941706qAeYEXhqvuT4CYRAUCWQdONrrowQ+voX/mqyrsGu+/AOjTHD9Oob00cSq4KhioDBN+eZj9jQYGrTSjkdLBc53nHwMK+9x8gQMy3e2MNQDTVIKt0AALAUY9jzwa/sP876IVrKK9vZu5XY8LLGHDj+B40aG0eZWMcPZ2iHSKdiD6IPWIoRKSenGQkYrzPkOdkEkD6SuO5RJYyJlHqQmt7ZqgFZn1wDlxYPUwLptwolayWnaXfrLd88S+zDlmJ0zs6TNSdxrEsNNQo7xGA8YNnKVuRJ6mnPttAbIAmYmkuVjxX3KeFRoywxoR0nK6ZFbygOvPTO4B4ABqocOkKzxd9Naq6w5d0QyvYj0S1WTDJjtWwGImndXBI/ppjh4PIiH5+i7tl1C4FbESBx09lp9r1LqIyPsK5BrJkTcpVuKODDoxw4TM2DIALSvUmvFD8K4hCX3WQfQ2PvvdRkaRQlPWHIc+IC3/6FCdsmuH390ljqEUKRMjqMSKacc5mb1ukaP53j2O8sxgS+a3pqqMtZnAfIjHYuI3E4hwn7jzDWYNinvczIhRCIsL5GRO/uGfQSqIilpdeK1uezXBV3pZWSBk/P5z1PQJVIczWnGEsiKYmtsgqJMDNPFDM+gvdL3Sow32ZqC4/dw4HD1IOuLanR9PZAN4qk4IFQeWY7P17gq9NsCHL/zkDBEStzISa986oA4ASDmzfy1rM05/n5HF+cYP1ILn0zz7QjXnyE5x5G9eoJK8ultaQbXPfs+yxndHKrCMyHTE2yfTN1z61jqZEreUAg8Ly8E+DN92lHSK565iuRGjUPvpxJUosh1Gk4UcxEg+e3rbGRLUZ4Rxim1pt1q6dlfcAJWsZgqZlKs2WacaRpI+spsIPlxgCfFJNOF8tJoE42CyX0MrmyE+cljIHhpS8xV9h1Keqf0gVpvn8V5Z30PVIuRrjMG4tRBsOg1CiJlDAwwjhVEAKLcb8A225irsXFWS7OctckjYBYc0E1IA8YXtg6wUyL6XlmF9g6vpLLgxVG4ZceZ3KC8zOMNHj6Id7+KEvZAajRThInpfOF+5kcZS7khmEevQ1YtZgreMexeyonMWKcZK1AyveAJH3XUCVwPHlnGUN9rBjESj0gUsIQJ8RKOyzZ/sWISBEI4/QtThjjBJYX0quqQt4ROGoegd0PsHGMuRZe2LMj0/ElHU/cTd3xb5vRGjvv6JZyL6W+Wjw/w5+XmBhly+byc+Bsk0stNo0wOVa93L3KuwNZ1VvLfsZisjGIwQBUv9BUABVABVABVAAVQAVQAVQAFcD/CeA/2RXKPWR6TjsAAAAASUVORK5CYII=) center/cover;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--blue),var(--glow);width:30px;height:30px}

/* ===== ルーム形式 ===== */
.rooms{display:grid;gap:10px;margin-bottom:12px}
.room-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px;min-height:76px;box-shadow:0 6px 18px rgba(11,13,18,.04);transition:transform .1s}
.room-btn:active{transform:scale(.98)}
.room-btn.next{border:1.5px solid var(--ink);box-shadow:0 14px 34px rgba(31,94,255,.14),0 0 0 4px rgba(31,94,255,.06)}
.room-btn.done{opacity:.5;box-shadow:none}
.rb-no{font-family:var(--num);font-weight:300;font-size:24px;color:var(--sub);min-width:30px}
.room-btn.next .rb-no{color:var(--blue);font-weight:600}
.rb-main{flex:1;min-width:0}
.rb-main b{display:block;font-size:17px;font-weight:700;letter-spacing:.04em}
.rb-main small{display:block;font-family:var(--num);font-weight:600;font-size:15px;color:var(--sub);letter-spacing:.04em}
.rb-st{font-family:var(--num);font-weight:600;font-size:22px;color:var(--sub)}
.rb-st.ok{color:var(--blue)}
.rb-st.pain{color:#d23b4b;font-size:14px;font-family:var(--jp)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);opacity:.35}
.dots i.on{background:var(--grad);border:0;opacity:1;box-shadow:0 0 8px rgba(79,195,255,.7)}
.room{padding-top:2px}
.room-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;letter-spacing:.06em;min-height:42px}
.room-no{font-family:var(--num);font-weight:300;font-size:16px;letter-spacing:.2em;color:var(--blue)}
.room-name{font-size:28px;font-weight:800;letter-spacing:.04em;margin:2px 0 4px;line-height:1.25}
.room-target{color:var(--sub);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.room-target b{font-family:var(--num);font-weight:600;font-size:24px;color:var(--ink);letter-spacing:.02em}
.memo-tag{margin-left:8px;background:var(--blue-weak);color:var(--blue);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.wbox{display:flex;align-items:center;gap:10px;margin:16px 0 18px}
.wbox>button{width:72px;height:72px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:30px;font-weight:300;color:var(--ink);box-shadow:0 6px 16px rgba(11,13,18,.06)}
.wbox>button:active{background:var(--blue-weak);color:var(--blue)}
.wval{flex:1;display:flex;align-items:baseline;justify-content:center;min-width:0}
.wval input{border:0;background:transparent;box-shadow:none!important;padding:0;width:100%;max-width:190px;text-align:center;font-family:var(--num);font-weight:600;font-size:76px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.wval span{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--sub);margin-left:4px}
.wbox.off{opacity:.35;pointer-events:none}
.setdots{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.sd{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sd b{font-family:var(--num);font-weight:600;font-size:24px}
.sd small{font-family:var(--en);font-weight:700;font-size:8px;letter-spacing:.2em;color:var(--sub);margin-top:3px}
.sd.now{border:2px solid var(--ink)}
.sd.on{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 18px rgba(31,94,255,.35)}
.sd.on small{color:#fff;font-family:var(--jp);font-size:11px;letter-spacing:0}
.sd:disabled{opacity:1}
.setbtn{width:100%;height:120px;border:0;border-radius:32px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 18px 40px rgba(11,13,18,.25),0 0 0 6px rgba(31,94,255,.08);position:relative;overflow:hidden}
.setbtn::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 11px,rgba(79,195,255,.22) 11px 12px)}
.setbtn:active{transform:scale(.98)}
.setbtn small{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.4em;color:#9fd8ff}
.setbtn b{font-family:var(--num);font-weight:600;font-size:64px;line-height:1;background:linear-gradient(120deg,#8fd6ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.setbtn span{font-weight:700;font-size:15px;letter-spacing:.1em}
.room-done{text-align:center;font-family:var(--en);font-weight:700;font-size:20px;letter-spacing:.5em;padding-left:.5em;margin:4px 0 16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.next-name{text-align:center;color:var(--sub);font-weight:700;margin-top:8px;letter-spacing:.06em}
.undo{display:block;margin:14px auto 0;border:0;background:none;color:var(--sub);font-weight:700;font-size:13px;letter-spacing:.08em;padding:8px 14px;text-decoration:underline;text-underline-offset:3px}
.room-sh{margin-top:20px}
.mrow{gap:4px;padding-right:12px}
.tg{flex:none;min-width:58px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--sub)}
.tg.on{background:var(--grad);border:0;color:#fff;box-shadow:0 4px 12px rgba(31,94,255,.3)}
.mrow.off{opacity:1}
.mrow.off .mrow-main{opacity:.55}
/* 完了画面 */
.done-screen{position:relative;text-align:center;padding-top:18px;overflow:hidden;margin:0 -18px;padding-left:18px;padding-right:18px}
body{overflow-x:clip}
.done-rings{position:absolute;left:50%;top:-40px;width:420px;height:420px;margin-left:-210px;border-radius:50%;pointer-events:none;z-index:-1;
  background:repeating-radial-gradient(circle,transparent 0 19px,rgba(31,94,255,.13) 19px 20px);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:ring 2.4s ease-out}
@keyframes ring{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.done-no{font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.24em;color:var(--blue);margin-top:40px}
.done-title{font-family:var(--en);font-weight:700;font-size:40px;letter-spacing:.18em;padding-left:.18em;margin:10px 0 4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 20px rgba(31,94,255,.35));animation:pop .6s ease-out}

</style>

<body>
<header class="top">
  <div class="brand"><span class="brand-t"><span>筋トレ管理</span></span></div>
  <span class="badge" id="weekBadge"></span>
</header>
<main id="view"></main>
<div id="timerBar" class="timer hidden"></div>
<nav class="tabs">
  <button class="tab" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span>トレ</span></button>
  <button class="tab" data-act="tab" data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>振り返り</span></button>
  <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>メニュー</span></button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="toast" class="toast"></div>
<div id="dlg" class="dlg hidden" role="dialog" aria-modal="true"><div class="dlg-box"><div id="dlgBody"></div><div class="dlg-btns"><button type="button" id="dlgNo" class="btn ghost">やめる</button><button type="button" id="dlgOk" class="btn primary">OK</button></div></div></div>

<script>
'use strict';
/* ========== 基本ユーティリティ ========== */
const KEY = 'kintore.v1';
const DOW = ['日','月','火','水','木','金','土'];
const ARW = {up:'▲', down:'▼', keep:'', hold:'■', new:''};
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;
const isNum = v => v !== null && v !== undefined && v !== '' && !isNaN(v);
const fmt = n => isNum(n) ? String(r2(+n)) : '—';
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const pd = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const md = s => { const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const mdShort = s => { const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fullD = s => s.replace(/-/g,'/');
const weekStart = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const rr = d => +d.repMin === +d.repMax ? d.repMax : `${d.repMin}〜${d.repMax}`;

/* ========== 初期データ ========== */
function exDef(id, name, weight, sets, repMin, repMax, step, opt = {}) {
  return {id, name, weight, sets, repMin, repMax, step, memo:'', form:'', enabled:true, warmup:false, ...opt};
}
function FIXED_MENU() {
  return [
    exDef('chest','チェストプレス',36,3,8,10,2.5),
    exDef('latpd','ラットプルダウン(前)',38,3,8,10,2.5),
    exDef('legpress','レッグプレス',98,3,10,10,5),
    exDef('row','シーテッドロー',35,3,10,10,2.5),
    exDef('fly','フライ',22,2,10,12,2.5),
    exDef('abd','アブドミナル',45,3,12,12,2.5),
    exDef('rotary','ロータリートーソ',28,2,10,10,2.5,{memo:'左右'}),
    ...GYM_EXTRA()
  ];
}
/* ジムにあるほかのマシン(普段はOFF。メニュータブでONにすると使える) */
function GYM_EXTRA() {
  return [
    exDef('latpd_b','ラットプルダウン(後ろ)',null,3,8,10,2.5,{enabled:false}),
    exDef('legext','レッグエクステンション',42.6,2,10,12,2.5,{enabled:false}),
    exDef('legcurl','シーテッドレッグカール',null,2,10,12,2.5,{enabled:false}),
    exDef('back','バック',45,2,10,12,2.5,{enabled:false}),
    exDef('adduct','アダクション(内側)',null,2,10,12,2.5,{enabled:false}),
    exDef('abduct','アブダクション(外側)',null,2,10,12,2.5,{enabled:false}),
  ];
}
function defaultState() {
  return {
    v: 6,
    settings: {startDate:'2026-11-01', timer:90, theme:'light', sound:true, autoProg:false},
    menus: {A: FIXED_MENU(), B: []},
    cardioPlan: {type:'ランニングマシン', note:'競歩・傾斜15%・4km/h', min:15},
    sessions: [],
    active: null
  };
}
const TEMPLATES = [
  {eq:'ダンベル', name:'ダンベルプレス', weight:10, sets:3, repMin:8, repMax:10, step:1},
  {eq:'ダンベル', name:'ダンベルロー(片手)', weight:10, sets:3, repMin:8, repMax:10, step:1},
  {eq:'ダンベル', name:'ダンベルショルダープレス', weight:6, sets:3, repMin:8, repMax:10, step:1},
  {eq:'ダンベル', name:'サイドレイズ(ダンベル)', weight:2, sets:2, repMin:12, repMax:15, step:1},
  {eq:'ダンベル', name:'ダンベルカール', weight:6, sets:2, repMin:10, repMax:12, step:1},
  {eq:'ダンベル', name:'ルーマニアンデッドリフト(ダンベル)', weight:10, sets:3, repMin:8, repMax:10, step:1},
  {eq:'スミス', name:'スミスマシン スクワット', weight:20, sets:3, repMin:8, repMax:10, step:2.5},
  {eq:'スミス', name:'スミスマシン ベンチプレス', weight:20, sets:3, repMin:8, repMax:10, step:2.5},
  {eq:'スミス', name:'スミスマシン ショルダープレス', weight:10, sets:3, repMin:8, repMax:10, step:2.5},
  {eq:'ケーブル', name:'ケーブルプッシュダウン', weight:15, sets:2, repMin:10, repMax:12, step:2.5},
  {eq:'ケーブル', name:'ケーブルフェイスプル', weight:10, sets:2, repMin:12, repMax:15, step:2.5},
  {eq:'ケーブル', name:'ケーブルロー', weight:20, sets:3, repMin:8, repMax:10, step:2.5},
  {eq:'ケーブル', name:'ケーブルクランチ', weight:20, sets:2, repMin:10, repMax:12, step:2.5},
];

/* ========== 保存 ========== */
function migrate(s) {
  const d = defaultState();
  const old = s.settings || {};
  s.settings = {...d.settings, startDate: old.startDate || d.settings.startDate, timer: +old.timer || 90,
    theme: old.theme === 'dark' ? 'dark' : 'light', sound: old.sound !== false, autoProg: old.autoProg === true};
  s.sessions = Array.isArray(s.sessions) ? s.sessions : [];
  delete s.swaps; delete s.menuLabel; delete s.body; delete s.meals;  // 削除した機能のデータ
  if (!s.v || s.v < 2 || !s.menus || !s.menus.A) {  // A/B → 固定メニューへ移行
    s.menus = d.menus; s.v = 2;
  }
  s.menus.B = s.menus.B || [];
  if (s.v < 3) { s.settings.timer = 60; s.v = 3; }  // 休憩は60秒固定に
  if (s.v < 4) {  // ジムのほかのマシンを種目一覧に追加(OFF)
    const have = new Set(s.menus.A.map(d => d.id));
    GYM_EXTRA().forEach(d => { if (!have.has(d.id)) s.menus.A.push(d); });
    s.v = 4;
  }
  if (s.v < 6) { s.settings.timer = 90; s.v = 6; }  // 休憩の初期値を90秒に
  s.cardioPlan = s.cardioPlan || d.cardioPlan;
  if (/^競歩/.test(s.cardioPlan.type || '')) s.cardioPlan = {...d.cardioPlan, min:s.cardioPlan.min || 15};
  if (s.cardioPlan.note == null) s.cardioPlan.note = '';
  return s;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.menus) return migrate(s); } catch (e) {}
  return defaultState();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('保存に失敗しました(容量不足の可能性)'); }
}
const U = {tab:'train', calY:null, calM:null, chartEx:null, chartMode:'max', openHist:null, editing:null, doneId:null};

/* ========== 種目・履歴・提案ロジック ========== */
const allDefs = () => [...S.menus.A, ...S.menus.B];
const findDef = id => allDefs().find(d => d.id === id) || null;
const doneSets = e => (e.sets || []).filter(s => s.done);
const recWeight = e => { const d = doneSets(e); return d.length ? Math.max(...d.map(s => +s.w || 0)) : null; };
const exVolume = e => e.warmup ? 0 : doneSets(e).reduce((a, s) => a + (+s.w||0)*(+s.r||0), 0);
const sessVolume = s => s.exercises.reduce((a, e) => a + exVolume(e), 0);
function history(exId) { // 新しい順
  const out = [];
  for (let i = S.sessions.length-1; i >= 0; i--) {
    const s = S.sessions[i];
    s.exercises.forEach(e => { if (e.exId === exId) out.push({...e, date:s.date, finishedAt:s.finishedAt}); });
  }
  return out;
}
const isTop = e => !e.aborted && doneSets(e).length >= e.targetSets && doneSets(e).every(s => +s.r >= +e.repMax);
const isUnder = e => !e.aborted && doneSets(e).some(s => +s.r < +e.repMin);
function setsText(e) {
  const d = doneSets(e);
  if (!d.length) return e.aborted ? '中止(痛み)' : '—';
  const ws = [...new Set(d.map(s => +s.w))];
  if (ws.length === 1) return `${fmt(ws[0])}kg × ${d.map(s => s.r).join('・')}`;
  return d.map(s => `${fmt(s.w)}×${s.r}`).join(' / ');
}
/* 二重漸進法 */
function suggest(def) {
  const base = isNum(def.weight) ? +def.weight : null;
  const step = +def.step || 2.5;
  if (def.warmup) return {w:base, kind:'keep', msg:''};
  const h = history(def.id).filter(e => doneSets(e).length || e.aborted);
  if (!h.length) return {w:base, kind:'new', msg:''};
  const last = h[0];
  if (def.manualAt && def.manualAt > (last.finishedAt || 0)) return {w:base, kind:'keep', msg:''};
  const lw = recWeight(last) || base;
  if (!lw) return {w:base, kind:'keep', msg:''};
  if (!S.settings.autoProg) return {w:lw, kind:'keep', msg:''};  // 重量キープ設定
  if (h.length >= 2 && isUnder(h[0]) && isUnder(h[1]))
    return {w:r2(Math.max(lw - step, 0)), kind:'down', msg:'2回連続未達 → 1段階ダウン'};
  if (isTop(last))
    return {w:r2(lw + step), kind:'up', msg:`全セット達成 → +${fmt(step)}kg`};
  return {w:lw, kind:'keep', msg:''};
}
const progWeek = () => { const n = daysBetween(S.settings.startDate, today()); return n < 0 ? 1 : Math.floor(n/7) + 1; };
const rirMsg = () => progWeek() <= 2 ? 'あと2〜3回の余裕で' : 'あと1〜2回の余裕で';
const sessNo = n => String(n).padStart(2, '0');
function bestBefore(exId) { let b = 0; history(exId).forEach(e => { if (!e.warmup) { const w = recWeight(e); if (w > b) b = w; } }); return b; }

/* ========== セッション ========== */
function buildEx(d) {
  const sg = suggest(d);
  const prev = history(d.id).find(e => doneSets(e).length || e.aborted);
  const sets = [];
  for (let k = 0; k < (+d.sets || 1); k++) {
    const ps = prev && doneSets(prev)[k];
    sets.push({w: sg.w == null ? '' : sg.w, r: ps ? +ps.r : +d.repMax, done:false});
  }
  return {exId:d.id, name:d.name, warmup:!!d.warmup, repMin:+d.repMin, repMax:+d.repMax, targetSets:+d.sets,
    step:+d.step || 2.5, w: sg.w == null ? '' : sg.w, sets, aborted:false, skipped:false, sugg:sg,
    prev: prev ? {date:prev.date, text:setsText(prev)} : null};
}
function startSession(menu) {
  const defs = S.menus[menu].filter(d => d.enabled);
  if (!defs.length) { toast('このメニューに種目がありません'); return; }
  S.active = {id:uid(), date:today(), menu, startedAt:Date.now(), exercises:defs.map(buildEx),
    cardio:{type:S.cardioPlan.type || '', note:S.cardioPlan.note || '', min:+S.cardioPlan.min || 0, done:false}, timerEnd:0, room:null, v:5};
  save(); wake(); render(); window.scrollTo(0,0);
}
const exDone = e => e.aborted || e.skipped || (e.sets.length > 0 && e.sets.every(s => s.done));
async function finishSession() {
  const A = S.active;
  const any = A.exercises.some(e => e.sets.some(s => s.done)) || (A.cardio && A.cardio.done);
  if (!any && !(await ask('完了したセットがありません。記録せずに終わりますか?', '終わる'))) return;
  const left = A.exercises.filter(e => !exDone(e)).length + (A.cardio && A.cardio.type && !A.cardio.done ? 1 : 0);
  if (any && left && !(await ask(`まだ${left}種目残っています。終わりますか?`, '終わる'))) return;
  if (!any) { S.active = null; stopTimer(); releaseWake(); save(); render(); return; }
  const sess = {id:A.id, date:A.date, menu:A.menu, startedAt:A.startedAt, finishedAt:Date.now(),
    cardio: A.cardio && A.cardio.done ? {type:A.cardio.type + (A.cardio.note ? '(' + A.cardio.note + ')' : ''), min:A.cardio.min} : {type:'', min:0},
    exercises: A.exercises.map(e => ({exId:e.exId, name:e.name, warmup:e.warmup,
      repMin:e.repMin, repMax:e.repMax, targetSets:e.targetSets, step:e.step, aborted:e.aborted,
      sets: e.sets.filter(s => s.done).map(s => ({w:+s.w||0, r:+s.r||0, done:true}))
    })).filter(e => e.sets.length || e.aborted)};
  sess.exercises.forEach(e => {
    const d = findDef(e.exId);
    if (d && e.sets.length && !e.warmup) { d.weight = Math.max(...e.sets.map(s => s.w)); delete d.manualAt; }
  });
  S.sessions.push(sess);
  S.sessions.sort((a, b) => a.date.localeCompare(b.date) || a.startedAt - b.startedAt);
  S.active = null; U.doneId = sess.id; stopTimer(); releaseWake(); save(); render(); window.scrollTo(0, 0);
}
/* 完了画面 */
function vComplete(sess) {
  const no = S.sessions.indexOf(sess) + 1;
  const sets = sess.exercises.reduce((a, e) => a + e.sets.length, 0);
  const dur = Math.max(1, Math.round((sess.finishedAt - sess.startedAt) / 60000));
  return `<div class="done-screen">
    <div class="done-rings"></div>
    <div class="done-no">SESSION ${sessNo(no)} · ${md(sess.date)}</div>
    <div class="done-title">COMPLETE</div>
    <div class="done-sub">おつかれさまでした</div>
    <div class="stats3"><div><b>${dur}</b>分</div><div><b>${sets}</b>セット</div><div><b>${Math.round(sessVolume(sess)).toLocaleString()}</b>kg</div></div>
    <div class="card p0 done-list">${sess.exercises.map(e => `<div class="plan-row"><span>${esc(e.name)}</span><b>${esc(setsText(e))}</b><i class="k"></i></div>`).join('')}
      ${sess.cardio && sess.cardio.type ? `<div class="plan-row"><span>${esc(sess.cardio.type)}</span><b>${sess.cardio.min}分</b><i class="k"></i></div>` : ''}</div>
    <button class="btn primary big block" data-act="shareDay" data-id="${sess.id}"><span>AIに共有</span></button>
    <p class="done-hint">その日の記録をCSVファイルで保存します</p>
    <button class="btn ghost block" data-act="closeDone">終わる</button>
  </div>`;
}
/* その日のCSV(AIに渡す用) */
function dayCsv(sess) {
  const rows = [['日付','種目','セット','重量kg','回数','目標','次回kg']];
  sess.exercises.forEach(e => {
    const last = history(e.exId).find(h => doneSets(h).length);
    const d = findDef(e.exId), sg = d && last && last.date === sess.date ? suggest(d) : null;
    e.sets.forEach((st, k) => rows.push([sess.date, e.name, k + 1, st.w, st.r, `${e.targetSets}×${rr(e)}`, k === 0 && sg && isNum(sg.w) ? sg.w : '']));
  });
  if (sess.cardio && sess.cardio.type) rows.push([sess.date, sess.cardio.type, '', '', '', `${sess.cardio.min}分`, '']);
  return '\ufeff' + rows.map(r => r.map(csvEsc).join(',')).join('\n');
}
/* CSVを保存(スマホは共有シート→「ファイルに保存」など、PCはダウンロード)
   ※ title や text を一緒に渡すと iPhone で余計なテキストファイルができるので、ファイルだけ渡す */
async function saveCsv(name, text) {
  try {
    const file = new File([text], name, {type:'text/csv'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file]});
      toast('共有しました'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(name, text, 'text/csv'); toast('CSVを保存しました');
}
async function shareDay(id) {
  const sess = S.sessions.find(x => x.id === id); if (!sess) return;
  await saveCsv(`training-${sess.date}.csv`, dayCsv(sess));
}
/* 直近4週間の記録をCSVで保存 */
async function downloadRecent() {
  const end = today(), start = addDays(end, -27);
  const ss = S.sessions.filter(s => s.date >= start && s.date <= end);
  if (!ss.length) { toast('直近4週間の記録がありません'); return; }
  const head = ['日付','種目','セット','重量kg','回数','目標','次回kg'];
  const body = ss.map(x => dayCsv(x).replace(/^\ufeff[^\n]*\n?/, '')).filter(Boolean);
  await saveCsv(`training-${start}_${end}.csv`, '\ufeff' + [head.join(','), ...body].join('\n'));
}

/* ========== タイマー ========== */
const T = {end:0, dur:90, iv:null};
/* ========== アラーム音 ==========
   音楽アプリの再生を止めないための方針:
   ・<audio> 要素は使わない(メディア要素は他アプリの音楽を止めることがある)
   ・Web Audio だけで鳴らす
   ・iPhone(Safari 17+)では audioSession を 'ambient' にして、他アプリの音と「混ぜて」鳴らす */
let AC = null;
function mixWithOtherAudio() {
  try { if (navigator.audioSession && navigator.audioSession.type !== 'ambient') navigator.audioSession.type = 'ambient'; } catch (e) {}
}
mixWithOtherAudio();
/* 画面タップのときに AudioContext を起こしておく(iPhone は操作の中でしか音を出せないため) */
function unlockAudio() {
  mixWithOtherAudio();
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') {
      AC.resume();
      const src = AC.createBufferSource(); src.buffer = AC.createBuffer(1, 1, 22050); src.connect(AC.destination); src.start(0);
    }
  } catch (e) {}
}
function beepWebAudio() {
  if (!AC) return;
  mixWithOtherAudio();
  try { if (AC.state !== 'running') AC.resume(); } catch (e) {}
  const t = AC.currentTime + .05;
  [0, .28, .56, 1.1, 1.38, 1.66].forEach(o => {
    const os = AC.createOscillator(), g = AC.createGain();
    os.type = 'square'; os.frequency.value = 880;
    g.gain.setValueAtTime(.0001, t+o); g.gain.exponentialRampToValueAtTime(.25, t+o+.02); g.gain.exponentialRampToValueAtTime(.0001, t+o+.2);
    os.connect(g); g.connect(AC.destination); os.start(t+o); os.stop(t+o+.22);
  });
}
function beep() {
  if (!S.settings.sound) return;
  try { navigator.vibrate && navigator.vibrate([200, 80, 200, 80, 200, 300, 200, 80, 200, 80, 200]); } catch (e) {}
  try { beepWebAudio(); } catch (e) {}
}
function startTimer(sec) {
  sec = sec || S.settings.timer;
  T.dur = sec; T.end = Date.now() + sec*1000;
  if (S.active) { S.active.timerEnd = T.end; S.active.timerDur = sec; save(); }
  clearInterval(T.iv); T.iv = setInterval(tick, 250);
  const el = $('#timerBar'); el && el.classList.remove('ring');
  tick();
}
function stopTimer() {
  T.end = 0; clearInterval(T.iv);
  if (S.active) { S.active.timerEnd = 0; save(); }
  tick();
}
function alarm() {
  beep();
  const el = $('#timerBar'); if (el) { el.classList.add('ring'); setTimeout(() => el.classList.remove('ring'), 4000); }
}
function tick() {
  const el = $('#timerBar'); if (!el || el.classList.contains('hidden')) { if (T.end && Date.now() >= T.end) { T.end = 0; clearInterval(T.iv); alarm(); } return; }
  let left = T.end ? T.end - Date.now() : 0;
  if (T.end && left <= 0) { T.end = 0; clearInterval(T.iv); left = 0; if (S.active) { S.active.timerEnd = 0; save(); } alarm(); }
  const run = T.end > 0;
  el.classList.toggle('run', run);
  const sec = run ? Math.ceil(left/1000) : S.settings.timer;
  const lb = $('#tLeft'); if (lb) lb.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  const lab = $('#tLabel'); if (lab) lab.textContent = run ? '■' : '▶';
  const f = $('#tFill'); if (f) f.style.width = run ? (100 - left/(T.dur*10)) + '%' : '0';
}
function renderTimerShell() {
  const el = $('#timerBar'); const show = !!S.active && U.tab === 'train';
  el.classList.toggle('hidden', !show); document.body.classList.toggle('has-timer', show);
  if (!show) return;
  el.innerHTML = `<div class="t-fill" id="tFill"></div><div class="t-row">
    <button class="t-main" data-act="timerToggle"><span id="tLabel"></span><b id="tLeft"></b></button>
</div>`;
  tick();
}

let WL = null;
async function wake() { try { if (S.active && 'wakeLock' in navigator && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); } } catch (e) {} }

/* アプリ内の確認ダイアログ(ブラウザの確認ダイアログはブロックされることがあるため使わない) */
function ask(msg, ok = 'OK', danger = false, html = '') {
  return new Promise(res => {
    const d = $('#dlg'), okb = $('#dlgOk'), no = $('#dlgNo');
    $('#dlgBody').innerHTML = `<p class="dlg-msg">${esc(msg)}</p>${html}`;
    okb.textContent = ok; okb.classList.toggle('dlg-danger', danger);
    okb.style.display = ok ? '' : 'none';
    d.classList.remove('hidden');
    const done = v => { d.classList.add('hidden'); okb.onclick = no.onclick = d.onclick = null; res(v); };
    okb.onclick = () => done(true); no.onclick = () => done(false);
    d.onclick = ev => { const n = ev.target.closest('[data-pick]'); if (n) done(+n.dataset.pick); else if (ev.target === d) done(false); };
  });
}

let lastSetTap = 0;
function completeSet(i) {
  const A = S.active, e = A.exercises[i], j = e.sets.findIndex(s => !s.done);

  if (!isNum(e.w) || +e.w <= 0) { toast('先に重量を入れてください'); const inp = $('.wval input'); inp && inp.focus(); return; }
  lastSetTap = Date.now();
  const s = e.sets[j];
  s.w = isNum(e.w) ? +e.w : 0; s.r = +e.repMax; s.done = true;
  if (!e.warmup && !e.prDone) {

  }

/* ========== グラフ ========== */
function lineChart(pts, o = {}) {
  if (!pts.length) return '<div class="empty">—</div>';
  const W = 340, H = o.h || 170, L = 36, R = 14, Tp = 18, B = 22;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 1e-9) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * .12; mn -= pad; mx += pad;
  const n = pts.length;
  const X = k => n === 1 ? (L + W - R)/2 : L + k*(W - L - R)/(n - 1);
  const Y = v => Tp + (H - Tp - B)*(1 - (v - mn)/(mx - mn));
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = mn + (mx - mn)*k/3, y = Y(v).toFixed(1); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-5}" y="${+y+3}" text-anchor="end" class="tl">${Math.round(v*10)/10}</text>`; }
  const every = Math.max(1, Math.ceil(n/5));
  let xl = '';
  pts.forEach((p, k) => { if ((k % every === 0 && n - 1 - k >= every/2) || k === n-1) xl += `<text x="${X(k).toFixed(1)}" y="${H-5}" text-anchor="middle" class="tl">${esc(p.x)}</text>`; });
  const d = pts.map((p, k) => `${k ? 'L' : 'M'}${X(k).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const dots = pts.map((p, k) => `<circle cx="${X(k).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" class="dot ${o.cls||''}"/>`).join('');
  const lp = pts[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}${xl}<path d="${d}" class="ln ${o.cls||''}"/>${dots}<text x="${Math.min(X(n-1), W-R).toFixed(1)}" y="${(Y(lp.y)-8).toFixed(1)}" text-anchor="end" class="tv">${fmt(lp.y)}${o.unit||''}</text></svg>`;
}
function barChart(pts, o = {}) {
  if (!pts.length || pts.every(p => !p.y)) return '<div class="empty">—</div>';
  const W = 340, H = o.h || 160, L = 40, R = 6, Tp = 16, B = 22;
  const mx = Math.max(...pts.map(p => p.y)) * 1.1 || 1, n = pts.length, bw = (W - L - R)/n;
  let g = '';
  for (let k = 0; k <= 2; k++) { const v = mx*k/2, y = (Tp + (H - Tp - B)*(1 - v/mx)).toFixed(1); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-5}" y="${+y+3}" text-anchor="end" class="tl">${v >= 1000 ? (v/1000).toFixed(1)+'t' : Math.round(v)}</text>`; }
  const bars = pts.map((p, k) => { const h = (H - Tp - B)*(p.y/mx), x = L + k*bw + bw*.18; return `<rect x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="bar-r ${k===n-1?'last':''}"/>` + `<text x="${(L + k*bw + bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="tl">${k % 2 === (n-1) % 2 ? esc(p.x) : ''}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}${bars}</svg>`;
}

/* ========== 画面:振り返り ========== */

  allDefs().forEach(d => { if (!d.warmup) m.set(d.id, d.name); });
  S.sessions.forEach(s => s.exercises.forEach(e => { if (!e.warmup && !m.has(e.exId)) m.set(e.exId, e.name); }));
  return [...m.entries()];
}
function calendarHtml() {
  const now = new Date();
  if (U.calY == null) { U.calY = now.getFullYear(); U.calM = now.getMonth(); }
  const y = U.calY, m = U.calM, first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate();
  const byDate = {}; S.sessions.forEach(s => (byDate[s.date] = byDate[s.date] || []).push('●'));
  const rows = Math.ceil((offset + days)/7), t = today();
  let h = `<div class="cal-nav"><button data-act="calNav" data-d="-1" aria-label="前の月">‹</button><b>${y}年${m+1}月</b><button data-act="calNav" data-d="1" aria-label="次の月">›</button></div>
    <div class="cal-h">${['月','火','水','木','金','土','日'].map((d, k) => `<span class="${[1,3,5].includes(k)?'rec':''}">${d}</span>`).join('')}<span></span></div>`;
  for (let r = 0; r < rows; r++) {
    h += '<div class="cal-r">'; let cnt = 0;
    for (let k = 0; k < 7; k++) {

}

function coachSummary() {
  const end = today(), start = addDays(end, -27);
  const ss = S.sessions.filter(s => s.date >= start && s.date <= end);
  const L = [];
  L.push(`【筋トレ 直近4週間サマリー】${fullD(start)}〜${fullD(end)}`);
  L.push(`プログラム第${progWeek()}週(開始 ${fullD(S.settings.startDate)})/強度の目安:${rirMsg()}`);
  L.push(`トレーニング回数:${ss.length}回(週平均 ${(ss.length/4).toFixed(1)}回)`);
  L.push('', '■ セッション記録');
  if (!ss.length) L.push('(記録なし)');
  ss.forEach(s => {
    const c = [];
    if (s.cardio && s.cardio.type && s.cardio.type !== 'なし') c.push(`有酸素:${s.cardio.type}${s.cardio.min ? ' ' + s.cardio.min + '分' : ''}`);
    L.push(`${md(s.date)}${c.length ? '(' + c.join('・') + ')' : ''}`);
    s.exercises.forEach(e => { if (!e.warmup) L.push(` - ${e.name}:${setsText(e)}`); });
  });
  L.push('', `■ 種目別の推移(期間内の最大重量 最初→最新 / 次回${S.settings.autoProg ? 'の推奨' : '(重量キープ設定)'})`);
  const ids = [];
  ss.forEach(s => s.exercises.forEach(e => { if (!e.warmup && !ids.includes(e.exId)) ids.push(e.exId); }));
  ids.forEach(id => {
    const recs = []; ss.forEach(s => s.exercises.forEach(e => { if (e.exId === id && doneSets(e).length) recs.push(e); }));
    if (!recs.length) return;
    const d = findDef(id); const sg = d ? suggest(d) : null;
    L.push(` - ${recs[0].name}:${fmt(recWeight(recs[0]))}kg → ${fmt(recWeight(recs[recs.length-1]))}kg(${recs.length}回実施)${sg && isNum(sg.w) ? ` / 次回 ${fmt(sg.w)}kg` : ''}`);
  });
  return L.join('\n');
}
async function copyText(t) {

}

function saveExForm(fd) {
  const E = U.editing; if (!E) return;
  const num = (k, def) => { const v = String(fd.get(k) || '').replace(',', '.').trim(); return v === '' || isNaN(v) ? def : +v; };
  const name = String(fd.get('name') || '').trim(); if (!name) { toast('種目名を入力してください'); return; }
  const list = S.menus[E.m];
  let d = E.isNew ? {id:E.id, memo:'', form:''} : list[E.i];
  const newW = num('weight', null);
  if (!E.isNew && newW !== (isNum(d.weight) ? +d.weight : null)) d.manualAt = Date.now();
  Object.assign(d, {name, weight:newW, step:num('step', 2.5) || 2.5, sets:Math.max(1, Math.round(num('sets', 3))),
    repMin:Math.max(1, Math.round(num('repMin', 8))), repMax:Math.max(1, Math.round(num('repMax', 10))),
    memo:String(fd.get('memo') || ''), form:String(fd.get('form') || ''), enabled:fd.get('enabled') === 'on', warmup:fd.get('warmup') === 'on'});
  if (d.repMin > d.repMax) [d.repMin, d.repMax] = [d.repMax, d.repMin];

  save(); closeSheet(); render(); toast('保存しました');

function download(name, text, type) {

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function importJson(file) {
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    const data = obj.data || obj;
    if (!data.menus || !data.sessions) throw new Error('形式が違います');
    if (!(await ask(`バックアップ(${obj.exportedAt ? obj.exportedAt.slice(0,10) : '日付不明'})を読み込みます。今のデータは上書きされます。`, '読み込む', true))) return;
    S = migrate(data); repairActive(); U.doneId = null; U.openHist = null; stopTimer(); save();

    case 'finish': finishSession(); break;

    case 'addExToSession': {

/* 古いバージョンで始めた途中のトレーニングを今のメニューに合わせて直す */
function repairActive() {
  const A = S.active; if (!A) return;
  const defs = S.menus.A.filter(d => d.enabled);
  const anyDone = A.exercises.some(e => e.sets.some(x => x.done));
  if (!A.v && !anyDone && A.exercises.map(e => e.exId).join() !== defs.map(d => d.id).join()) {
    A.exercises = defs.map(buildEx); A.room = null;
  }
  A.exercises.forEach(e => {
    if (e.w === undefined) { const d = doneSets(e); e.w = d.length ? d[d.length-1].w : (e.sugg && e.sugg.w != null ? e.sugg.w : ''); }
  });
  if (!A.cardio || !A.cardio.type) A.cardio = {type:S.cardioPlan.type || '', note:S.cardioPlan.note || '', min:+S.cardioPlan.min || 0, done:false};
  if (A.room === undefined || (typeof A.room === 'number' && !A.exercises[A.room])) A.room = null;
  A.v = 5; save();
}
repairActive();
try { indexedDB.deleteDatabase('kintore'); } catch (e) {}  // 写真機能の削除に伴い、保存済みの写真も消す
if (S.active && S.active.timerEnd > Date.now()) { T.end = S.active.timerEnd; T.dur = S.active.timerDur || S.settings.timer; T.iv = setInterval(tick, 250); }
render();
if (S.active) wake();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
